# ─────────────────────────────────────────────────────────────────────────
# AgentSeva — Razorpay Agentic Commerce & Recovery Engine
# Boots PostgreSQL, runs Alembic, then starts the backend and frontend.
#   Backend : http://localhost:8000  (docs at /docs)
#   Frontend: http://localhost:5173  (chat left · live audit logs right)
# ─────────────────────────────────────────────────────────────────────────
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentseva
      POSTGRES_USER: agentseva
      POSTGRES_PASSWORD: agentseva
    volumes:
      - agentseva_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentseva -d agentseva"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentseva-backend
    command: ["python", "-m", "app.db.migrate_compose"]
    environment:
      DATABASE_URL: "${COMPOSE_DATABASE_URL:-postgresql+psycopg://agentseva:agentseva@db:5432/agentseva}"
    depends_on:
      db:
        condition: service_started
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentseva-backend
    ports:
      - "8000:8000"
    environment:
      # Sensible demo defaults; override via a root .env file.
      RAZORPAY_MODE: "${RAZORPAY_MODE:-mock}"
      RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID:-}"
      RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET:-}"
      RAZORPAY_WEBHOOK_SECRET: "${RAZORPAY_WEBHOOK_SECRET:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      CLAUDE_MODEL: "${CLAUDE_MODEL:-claude-3-5-sonnet-latest}"
      DATABASE_URL: "${COMPOSE_DATABASE_URL:-postgresql+psycopg://agentseva:agentseva@db:5432/agentseva}"
      SQLALCHEMY_ECHO: "False"
    depends_on:
      db:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: agentseva-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  agentseva_postgres:
