[project]
name = "agentseva"
version = "0.1.0"
description = "Replit runtime dependencies for the AgentSeva FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "fastapi>=0.136.0",
    "httpx>=0.28.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "pytest>=8.4.0",
    "pytest-cov>=5.0.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.46.0",
]
